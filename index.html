<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎓 KBA Mock Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14201A;
    --ink-soft: #5B6F62;
    --bg: #F5F7EE;
    --panel: #FFFFFF;
    --border: #DCE6D2;
    --accent: #2F8F4E;
    --accent-2: #7CB518;
    --accent-soft: #E8F3E1;
    --shadow: 0 1px 2px rgba(20,32,26,0.05), 0 8px 24px rgba(20,32,26,0.08);
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Manrope', -apple-system, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #E9F1E6;
      --ink-soft: #93A895;
      --bg: #0E1712;
      --panel: #16211A;
      --border: #253326;
      --accent: #6BC17E;
      --accent-2: #A3D65C;
      --accent-soft: #1C2C1F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ink: #E9F1E6;
    --ink-soft: #93A895;
    --bg: #0E1712;
    --panel: #16211A;
    --border: #253326;
    --accent: #6BC17E;
    --accent-2: #A3D65C;
    --accent-soft: #1C2C1F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 480px; padding: 28px 20px 40px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; box-shadow: var(--shadow); text-align: center; }
  .icon { font-size: 40px; margin-bottom: 10px; }
  h1 { font-weight: 800; font-size: 24px; letter-spacing: -0.01em; margin: 0 0 6px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 30px; }
  .lesson-links { display: flex; flex-direction: column; gap: 14px; }
  a.lesson-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--accent-soft); border: 1.5px solid var(--border);
    color: var(--ink); text-decoration: none; font-weight: 700; font-size: 16px;
    padding: 18px 22px; border-radius: 16px;
    transition: border-color 0.12s ease, transform 0.12s ease, background 0.12s ease;
  }
  a.lesson-btn:hover { border-color: var(--accent); transform: translateY(-2px); background: var(--panel); }
  a.lesson-btn .label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  a.lesson-btn .label small { font-weight: 500; font-size: 12px; color: var(--ink-soft); }
  a.lesson-btn .arrow { font-family: var(--mono); color: var(--accent); font-size: 18px; }
  .credit { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 28px; opacity: 0.8; }
  .credit span { font-weight: 600; }
  @media (max-width: 420px) {
    .card { padding: 28px 22px; border-radius: 16px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">🐢🎓</div>
    <h1>KBA Mock Exams</h1>
    <p class="sub">Salesforce Admin Bootcamp &middot; pick a lesson set to practice</p>

    <div class="lesson-links">
      <a class="lesson-btn" href="lesson1-5.html">
        <span class="label">Lesson 1-5<small>Configuration, Object Manager, Sales & Marketing</small></span>
        <span class="arrow">→</span>
      </a>
      <a class="lesson-btn" href="lesson7-9.html">
        <span class="label">Lesson 7-9<small>Object Manager & App Builder, Productivity & Collaboration</small></span>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>
  <div class="credit">Built with 💚 by <span>Clarrent Nguyen</span> for Turtle Striker Force 🐢, Class 2026-2027</div>
</div>
</body>
</html>
